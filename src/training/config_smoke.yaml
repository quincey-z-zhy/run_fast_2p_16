# 烟测配置：最小步数验证训练管线，CPU 可运行
training:
  total_steps: 3000
  n_steps: 256
  num_envs: 1
  batch_size: 64
  n_epochs: 2
  eval_freq: 100000  # 烟测不评估
  eval_games: 50
  checkpoint_freq: 100000
  log_freq: 256

ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coeff: 0.5
  entropy_coeff: 0.05
  max_grad_norm: 0.5
  normalize_advantages: true

network:
  obs_dim: 80
  act_dim: 294
  hidden_dim: 256

self_play:
  enabled: false

league:
  enabled: false

eval_opponents:
  - random_legal

eval_thresholds:
  stage_7_main: 0.80

paths:
  checkpoint_dir: checkpoints/
  log_dir: logs/training/
